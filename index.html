<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Function Plotter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="plotCanvas"></canvas>

    <div id="controlPanel" class="draggable-panel">
        <div class="panel-header">
            <span>Function Input</span>
            <button id="togglePanelBtn">_</button>
        </div>
        <div class="panel-content">
            <textarea id="formulaInput" spellcheck="false" placeholder="// Enter formula script here...
// Examples:
// y = sin(x) @
// y2 = cos(x) #f00
// if (x > 0) { y3 = x } else { y3 = -x } y3 $"></textarea>
            <div class="button-group">
                <button id="plotBtn" class="button-primary">Plot / Update</button>
                <button id="clearBtn" class="button-secondary">Clear</button>
            </div>
            <div class="inline-controls">
                <label class="control-inline"><input type="checkbox" id="polarToggle"> Polar Mode</label>
            </div>
            <div id="cartesianControls" class="cartesian-controls">
                <div class="control-row"><label for="continuityCartesian">Continuity |Δy/Δx| Threshold:</label><input id="continuityCartesian" type="number" step="0.1" value="100"></div>
            </div>
            <div id="polarControls" class="polar-controls" style="display:none;">
                <div class="control-row"><label for="polarMin">Angle Min:</label><input id="polarMin" type="number" step="0.0001" value="-31.4159"></div>
                <div class="control-row"><label for="polarMax">Angle Max:</label><input id="polarMax" type="number" step="0.0001" value="31.4159"></div>
                <div class="control-row"><label for="polarStep">Angle Step:</label><input id="polarStep" type="number" step="0.000001" value="0.01"></div>
                <div class="control-row"><label for="continuityPolar">Continuity |Δr/Δt| Threshold:</label><input id="continuityPolar" type="number" step="0.1" value="100"></div>
            </div>
            <div class="help-text">
                Markers: @ (draw), $ (guide), #rgb (color)
            </div>
            <div id="errorLog" class="error-log" aria-live="polite"></div>
        </div>
    </div>

    <!-- Math Engine -->
    <script type="module" src="js/main.js?v=16"></script>
</body>
</html>
